name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: true

    name: foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize test dependency
        run: git -C lib/forge-std submodule update --init lib/ds-test

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
