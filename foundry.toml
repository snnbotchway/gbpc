[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = true
optimizer = true
optimizer_runs = 200
remappings = ["chainlink/=lib/chainlink/", "ds-test/=lib/forge-std/lib/ds-test/src/", "src/=src/", "script/=script/"]

[fmt]
line_length = 125

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
